name: roz_hisab
description: "Roz Hisab — Shopping lists, Udhar Khata aur Bill reminders, sab ek jagah."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  # app_icon.png has an alpha channel — App Store Connect rejects any
  # iOS icon with transparency, so it's flattened onto a solid
  # background automatically at icon-generation time.
  remove_alpha_ios: true
  background_color_ios: "#1E3A5F"
